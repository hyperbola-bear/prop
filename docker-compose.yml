services:
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: proppy-postgres
    environment:
      POSTGRES_USER: proppy
      POSTGRES_PASSWORD: proppy
      POSTGRES_DB: proppy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proppy -d proppy"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - proppy-pg-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: proppy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - proppy-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/proppy-photos || true &&
      mc anonymous set download local/proppy-photos
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: proppy-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  proppy-pg-data:
  proppy-minio-data:
